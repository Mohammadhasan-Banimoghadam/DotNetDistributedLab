name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Set Image Tag
        shell: bash
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build CustomerService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:${{ env.IMAGE_TAG }} -f ./src/Services/CustomerService/Dockerfile .

      - name: Build OrderService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:${{ env.IMAGE_TAG }} -f ./src/Services/OrderService/Dockerfile .

      - name: Build PaymentService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/paymentservice:${{ env.IMAGE_TAG }} -f ./src/Services/PaymentService/Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push CustomerService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:${{ env.IMAGE_TAG }}

      - name: Push OrderService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:${{ env.IMAGE_TAG }}

      - name: Push PaymentService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/paymentservice:${{ env.IMAGE_TAG }}


  deploy:
  
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
  
    steps:

      - name: Capture Previous Version
        shell: powershell
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          cd $env:DEPLOY_PATH

          $previousImage = docker inspect order-service --format '{{.Config.Image}}'

          if (-not $previousImage) {
            throw "Could not determine currently deployed image."
          }

          $previousTag = ($previousImage -split ':')[-1]

          Write-Host "Previous deployed tag: $previousTag"

          "PREVIOUS_TAG=$previousTag" >> $env:GITHUB_ENV


      - name: Deploy
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          cd $env:DEPLOY_PATH
  
          $env:IMAGE_TAG = $env:IMAGE_TAG.Substring(0,7)
  
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d


      - name: Health Check
        shell: powershell
        run: |
          $urls = @(
            "http://localhost:5260/health",
            "http://localhost:5096/health",
            "http://localhost:5015/health"
          )

          foreach ($url in $urls) {
            Write-Host "Checking $url"

            $healthy = $false

            for ($attempt = 1; $attempt -le 10; $attempt++) {

              try {
                $response = Invoke-WebRequest `
                  -Uri $url `
                  -UseBasicParsing `
                  -TimeoutSec 5

                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  Write-Host "$url is healthy."
                  break
                }
              }
              catch {
                Write-Host "Attempt $attempt failed for $url"
              }

              Write-Host "Waiting 3 seconds before next attempt..."
              Start-Sleep -Seconds 3
            }

            if (-not $healthy) {
              throw "Health check failed for $url after 10 attempts."
            }
          }


      - name: Rollback
        if: failure()
        shell: powershell
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          cd $env:DEPLOY_PATH

          $env:IMAGE_TAG = $env:PREVIOUS_TAG

          Write-Host "Rolling back to version: $env:IMAGE_TAG"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Build CustomerService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:latest -f ./src/Services/CustomerService/Dockerfile .

      - name: Build OrderService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:latest -f ./src/Services/OrderService/Dockerfile .

      - name: Build PaymentService Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/paymentservice:latest -f ./src/Services/PaymentService/Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push CustomerService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:latest

      - name: Push OrderService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:latest

      - name: Push PaymentService Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/paymentservice:latest

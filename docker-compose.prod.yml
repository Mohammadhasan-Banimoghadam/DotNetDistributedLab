services:

  order-service:
    image: dotnetdistributedlab/orderservice:${IMAGE_TAG}
    container_name: order-service

    ports:
      - "5260:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Services__CustomerService: "http://customer-service:8080"
      Services__PaymentService: "http://payment-service:8080"

    networks:
      - monitoring-network

    restart: unless-stopped


  payment-service:
    image: dotnetdistributedlab/paymentservice:${IMAGE_TAG}
    container_name: payment-service

    ports:
      - "5015:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      ConnectionStrings__PaymentDb: "Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"

    networks:
      - monitoring-network

    restart: unless-stopped


  customer-service:
    image: dotnetdistributedlab/customerservice:${IMAGE_TAG}
    container_name: customer-service

    ports:
      - "5096:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      ConnectionStrings__CustomerDb: "Server=sqlserver,1433;Database=CustomerDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"

    networks:
      - monitoring-network

    restart: unless-stopped


  product-service:
    image: dotnetdistributedlab/productservice:${IMAGE_TAG}
    container_name: product-service

    ports:
      - "5205:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      ConnectionStrings__ProductDb: "Server=sqlserver,1433;Database=ProductDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"

    networks:
      - monitoring-network

    restart: unless-stopped


networks:
  monitoring-network:
    external: true
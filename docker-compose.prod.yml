services:

  order-service:
    image: dotnetdistributedlab/orderservice:latest
    container_name: order-service

    ports:
      - "5260:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      Services__CustomerService: "http://customer-service:8080"
      Services__PaymentService: "http://payment-service:8080"

    networks:
      - monitoring-network

    restart: unless-stopped


  payment-service:
    image: dotnetdistributedlab/paymentservice:latest
    container_name: payment-service

    ports:
      - "5015:8080"

    networks:
      - monitoring-network

    restart: unless-stopped


  customer-service:
    image: dotnetdistributedlab/customerservice:latest
    container_name: customer-service

    ports:
      - "5096:8080"

    networks:
      - monitoring-network

    restart: unless-stopped


networks:
  monitoring-network:
    external: true
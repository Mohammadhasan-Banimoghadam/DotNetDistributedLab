services:

  order-service:
    image: orderservice:local
    container_name: order-service

    ports:
      - "5260:8080"

    environment:
     ASPNETCORE_ENVIRONMENT: "Development"
     OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
     Services__CustomerService: "http://customer-service:8080"
     Services__PaymentService: "http://payment-service:8080"
      
    networks:
      - monitoring-network

  payment-service:
    image: paymentservice:local
    container_name: payment-service
    ports:
      - "5015:8080"
    networks:
      - monitoring-network

  customer-service:
    image: customerservice:local
    container_name: customer-service
    ports:
      - "5096:8080"
    networks:
      - monitoring-network


networks:
  monitoring-network:
    external: true


      